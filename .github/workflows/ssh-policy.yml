name: SSH policy
# Fails when a tracked file reopens public SSH or weakens host-key checking (Goal 10).
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ssh_policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # First the fixtures, which show the check can fail on every pattern, then the
      # scripts' own tests.
      - name: Check tests and fixtures
        run: python3 -m unittest discover -s tests -v
      - name: Check every tracked file
        run: python3 scripts/check_ssh_policy.py
