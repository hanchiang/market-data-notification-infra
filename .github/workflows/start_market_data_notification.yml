name: Start Market data notification
concurrency:
  group: market-data-notification-instance
  cancel-in-progress: false
permissions:
  contents: read
on:
  schedule:
    # run time can be delayed by up to 30mins
    # 0 = sunday, 6 = saturday
    - cron: '05 12,13 * * 0-6' # every day
    - cron: '05 19,20 * * 0-6' # every day
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: false
        default: 'info' 
        type: choice
        options:
        - info
        - warning
        - debug
      ignoreTimezone:
        description: 'Run the workflow, disregarding the scheduled time it is supposed to run'
        type: boolean
        required: false
        default: false
env:
  TZ: America/New_York
  # Market open at 9.30am and close at 4pm local time.
  # Scheduled runs use paired UTC cron entries for DST; gate by local hour
  # so delayed runs still proceed while the DST counterpart hour is skipped.
  BEFORE_MARKET_OPEN_START_LOCAL_HOUR: 8
  BEFORE_MARKET_CLOSE_START_LOCAL_HOUR: 15
jobs:
  check_timezone:
    runs-on: ubuntu-latest
    outputs:
      should_proceed: ${{ steps.check_timezone.outputs.should_proceed }}
      current_local_time: ${{ steps.check_timezone.outputs.current_local_time }}
      skip_reason: ${{ steps.check_timezone.outputs.skip_reason }}
    steps:
      - name: Continue running only if current time is inside the local start window
        id: check_timezone
        env:
          IGNORE_TIMEZONE: ${{ github.event.inputs.ignoreTimezone || 'false' }}
        run: |
          current_local_time=$(TZ=$TZ date +%H%M)
          current_local_time=$((10#$current_local_time))
          current_local_hour=$(TZ=$TZ date +%H)
          current_local_hour=$((10#$current_local_hour))

          if [ "$IGNORE_TIMEZONE" = "true" ]
          then
            echo "should_proceed=true" >> "$GITHUB_OUTPUT"
            echo "current_local_time=$current_local_time" >> "$GITHUB_OUTPUT"
            echo "skip_reason=manual override ignoreTimezone=true" >> "$GITHUB_OUTPUT"
            echo "Ignore timezone"
            exit 0
          fi

          echo "current_local_time: $current_local_time, current_local_hour: $current_local_hour, BEFORE_MARKET_OPEN_START_LOCAL_HOUR: $BEFORE_MARKET_OPEN_START_LOCAL_HOUR, BEFORE_MARKET_CLOSE_START_LOCAL_HOUR: $BEFORE_MARKET_CLOSE_START_LOCAL_HOUR"

          if [ "$current_local_hour" -eq "$BEFORE_MARKET_OPEN_START_LOCAL_HOUR" ] || [ "$current_local_hour" -eq "$BEFORE_MARKET_CLOSE_START_LOCAL_HOUR" ]
          then
            echo "should_proceed=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=inside start hour" >> "$GITHUB_OUTPUT"
          else
            echo "should_proceed=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=outside local start hours 08 and 15 America/New_York" >> "$GITHUB_OUTPUT"
          fi
          echo "current_local_time=$current_local_time" >> "$GITHUB_OUTPUT"
  skip_outside_start_window:
    runs-on: ubuntu-latest
    needs: [check_timezone]
    if: ${{ needs.check_timezone.outputs.should_proceed != 'true' }}
    steps:
      - name: Record skipped start run
        run: |
          echo "Start workflow intentionally skipped."
          echo "Local time: ${{ needs.check_timezone.outputs.current_local_time }}"
          echo "Reason: ${{ needs.check_timezone.outputs.skip_reason }}"
          {
            echo "### Start workflow skipped"
            echo ""
            echo "- Local time: \`${{ needs.check_timezone.outputs.current_local_time }}\`"
            echo "- Reason: ${{ needs.check_timezone.outputs.skip_reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
  health_check:
    runs-on: ubuntu-latest
    needs: [check_timezone]
    if: ${{ needs.check_timezone.outputs.should_proceed == 'true' }}
    outputs:
      service_healthy: ${{ steps.health_check.outputs.service_healthy }}
    env:
      HOST_NAME: ${{ secrets.HOST_NAME }}
    steps:
      - name: Check if backend is already healthy
        id: health_check
        run: |
          if curl -fsS "$HOST_NAME/healthz" > /dev/null
          then
            echo "service_healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "service_healthy=false" >> "$GITHUB_OUTPUT"
          fi
  skip_already_healthy:
    runs-on: ubuntu-latest
    needs: [check_timezone, health_check]
    if: ${{ needs.check_timezone.outputs.should_proceed == 'true' && needs.health_check.outputs.service_healthy == 'true' }}
    steps:
      - name: Record skipped deploy because service is already healthy
        run: |
          echo "Start workflow skipped deploy because the backend is already healthy."
          {
            echo "### Start deploy skipped"
            echo ""
            echo "- Local time: \`${{ needs.check_timezone.outputs.current_local_time }}\`"
            echo "- Reason: backend already healthy"
          } >> "$GITHUB_STEP_SUMMARY"
  start_ec2_and_deploy:
    runs-on: ubuntu-latest
    needs: [check_timezone, health_check]
    if: ${{ needs.check_timezone.outputs.should_proceed == 'true' && needs.health_check.outputs.service_healthy != 'true' }}
    # id-token at job scope only, and no `environment:`, which would change the OIDC subject
    # the role trusts.
    permissions:
      contents: read
      id-token: write
    env:
      DOMAIN: ${{ secrets.DOMAIN }}
      SSH_USER: ${{ secrets.SSH_USER }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      LETSENCRYPT_BACKUP_AGE_PUBLIC_KEY: ${{ vars.LETSENCRYPT_BACKUP_AGE_PUBLIC_KEY }}
      # A literal, equal to the credentials step's aws-region: the step also exports
      # AWS_REGION, and a job-level value from a secret could disagree with it.
      AWS_REGION: us-east-1
      HOST_NAME: ${{ secrets.HOST_NAME }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up ansible
        run: |
          # Install ansible for instances/scripts/start.sh. The inventory is static, so no boto3.
          python3 -m pip install ansible

          python3 --version
          ansible --version
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_START_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: infra-start-${{ github.run_id }}
          translate-env-variables: false
          mask-aws-account-id: true
      - name: Ensure the pinned Session Manager plugin
        run: bash instances/scripts/helper/ensure_session_manager_plugin.sh
      - name: Create SSH private key and host key pin
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          # The pin is keyed by the alias market-data-notification-production, not a hostname.
          if [ -z "$SSH_KNOWN_HOSTS" ]
          then
            echo "SSH_KNOWN_HOSTS secret must be configured"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/market_data_notification_rsa
          chmod 600 ~/.ssh/market_data_notification_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts_market_data_notification
          chmod 644 ~/.ssh/known_hosts_market_data_notification
      - name: Run start script
        id: start_script
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          MARKET_DATA_NOTIFICATION_DEPLOY_TOKEN: ${{ secrets.MARKET_DATA_NOTIFICATION_DEPLOY_TOKEN }}
        run: |
          # Inputs by environment only: start.sh refuses arguments, which would put the token in argv.
          cd instances
          SSH_PRIVATE_KEY_PATH=~/.ssh/market_data_notification_rsa \
          SSH_KNOWN_HOSTS_FILE=~/.ssh/known_hosts_market_data_notification \
          ./scripts/start.sh
      - name: Wait for deployed service health
        run: |
          # start.sh only dispatches backend deploy, so wait here for the service to become healthy.
          for attempt in $(seq 1 30)
          do
            if curl -fsS "$HOST_NAME/healthz" > /dev/null
            then
              echo "market_data_notification is healthy"
              exit 0
            fi
            echo "Waiting for backend deploy health, attempt $attempt"
            sleep 20
          done
          echo "market_data_notification did not become healthy after start"
          exit 1
      - name: Cleanup temporary credentials
        if: ${{ always() }}
        run: sudo rm -rf ./instances/ansible/vars.yml ./instances/ansible/ansible.cfg ~/.ssh ~/.aws
  # Runs on every firing, whatever the time window or the backend's health says: a
  # break-glass rule left open and a silent login-line push are invisible to every other check.
  check_host_access_health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_START_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: infra-health-${{ github.run_id }}
          role-duration-seconds: 900
          translate-env-variables: false
          mask-aws-account-id: true
      - name: Check for a port 22 rule and a silent login-line push
        env:
          STOCKS_TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.STOCKS_TELEGRAM_DEV_BOT_TOKEN }}
          STOCKS_TELEGRAM_DEV_ID: ${{ secrets.STOCKS_TELEGRAM_DEV_ID }}
        # Phase 1 only: the flag tolerates main.tf's own port 22 rule. The phase 2 commit
        # that removes that ingress block deletes this flag too.
        run: bash instances/scripts/check_host_access_health.sh --allow-terraform-public-22
  notify_unsuccessful:
    runs-on: ubuntu-latest
    # The two checks are here because their failure leaves the start job skipped, not failed.
    needs: [check_timezone, health_check, start_ec2_and_deploy]
    # always(): without a status function GitHub adds success(), which skips this job on the
    # very failure it reports.
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    steps:
      - name: Send telegram notification unsuccessful run
        env:
          STOCKS_TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.STOCKS_TELEGRAM_DEV_BOT_TOKEN }}
          STOCKS_TELEGRAM_DEV_ID: ${{ secrets.STOCKS_TELEGRAM_DEV_ID }}
        run: |
          now=$(TZ=$TZ date +%Y-%m-%dT%H:%M:%S%z)
          text=$(echo "\[Github action\] Market data notification infra: Start run failed at $now. The deploy may not have been dispatched, check healthz. Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | sed 's~[[:blank:]]~%20~g')
          curl "https://api.telegram.org/bot${STOCKS_TELEGRAM_DEV_BOT_TOKEN}/sendMessage?chat_id=${STOCKS_TELEGRAM_DEV_ID}&text=$text"
  notify_successful:
    runs-on: ubuntu-latest
    needs: [start_ec2_and_deploy]
    if: ${{ always() && needs.start_ec2_and_deploy.result == 'success' }}
    steps:
      - name: Send telegram notification successful run
        env:
          STOCKS_TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.STOCKS_TELEGRAM_DEV_BOT_TOKEN }}
          STOCKS_TELEGRAM_DEV_ID: ${{ secrets.STOCKS_TELEGRAM_DEV_ID }}
        run: |
          now=$(TZ=$TZ date +%Y-%m-%dT%H:%M:%S%z)
          text=$(echo "\[Github action\] Market data notification infra: Successfully started EC2 and deployed Market data notification at $now. Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | sed 's~[[:blank:]]~%20~g')
          curl "https://api.telegram.org/bot${STOCKS_TELEGRAM_DEV_BOT_TOKEN}/sendMessage?chat_id=${STOCKS_TELEGRAM_DEV_ID}&text=$text"
