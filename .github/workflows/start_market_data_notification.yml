name: Start Market data notification
concurrency:
  group: market-data-notification-instance
  cancel-in-progress: false
permissions:
  contents: read
on:
  schedule:
    # run time can be delayed by up to 30mins
    # 0 = sunday, 6 = saturday
    - cron: '05 12,13 * * 0-6' # weekdays
    - cron: '05 19,20 * * 0-6' # weekdays
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: false
        default: 'info' 
        type: choice
        options:
        - info
        - warning
        - debug
      ignoreTimezone:
        description: 'Run the workflow, disregarding the scheduled time it is supposed to run'
        type: boolean
        required: false
        default: false
env:
  TZ: America/New_York
  # Market open at 9.30am and close at 4pm local time.
  # Scheduled runs use paired UTC cron entries for DST and can be delayed by up to 30 minutes.
  MORNING_START_WINDOW_START_HHMM: 0830
  MORNING_START_WINDOW_END_HHMM: 0930
  CLOSE_START_WINDOW_START_HHMM: 1545
  CLOSE_START_WINDOW_END_HHMM: 1645
jobs:
  check_timezone:
    runs-on: ubuntu-latest
    outputs:
      should_proceed: ${{ steps.check_timezone.outputs.should_proceed }}
      current_local_time: ${{ steps.check_timezone.outputs.current_local_time }}
      skip_reason: ${{ steps.check_timezone.outputs.skip_reason }}
    steps:
      - name: Continue running only if current time is inside the local start window
        id: check_timezone
        env:
          IGNORE_TIMEZONE: ${{ github.event.inputs.ignoreTimezone || 'false' }}
        run: |
          current_local_time=$(TZ=$TZ date +%H%M)
          current_local_time=$((10#$current_local_time))

          if [ "$IGNORE_TIMEZONE" = "true" ]
          then
            echo "should_proceed=true" >> "$GITHUB_OUTPUT"
            echo "current_local_time=$current_local_time" >> "$GITHUB_OUTPUT"
            echo "skip_reason=manual override ignoreTimezone=true" >> "$GITHUB_OUTPUT"
            echo "Ignore timezone"
            exit 0
          fi

          echo "current_local_time: $current_local_time, MORNING_START_WINDOW: $MORNING_START_WINDOW_START_HHMM-$MORNING_START_WINDOW_END_HHMM, CLOSE_START_WINDOW: $CLOSE_START_WINDOW_START_HHMM-$CLOSE_START_WINDOW_END_HHMM"

          if {
            [ "$current_local_time" -ge $((10#$MORNING_START_WINDOW_START_HHMM)) ] &&
            [ "$current_local_time" -le $((10#$MORNING_START_WINDOW_END_HHMM)) ];
          } || {
            [ "$current_local_time" -ge $((10#$CLOSE_START_WINDOW_START_HHMM)) ] &&
            [ "$current_local_time" -le $((10#$CLOSE_START_WINDOW_END_HHMM)) ];
          }
          then
            echo "should_proceed=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=inside start window" >> "$GITHUB_OUTPUT"
          else
            echo "should_proceed=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=outside local start windows 08:30-09:30 and 15:45-16:45 America/New_York" >> "$GITHUB_OUTPUT"
          fi
          echo "current_local_time=$current_local_time" >> "$GITHUB_OUTPUT"
  skip_outside_start_window:
    runs-on: ubuntu-latest
    needs: [check_timezone]
    if: ${{ needs.check_timezone.outputs.should_proceed != 'true' }}
    steps:
      - name: Record skipped start run
        run: |
          echo "Start workflow intentionally skipped."
          echo "Local time: ${{ needs.check_timezone.outputs.current_local_time }}"
          echo "Reason: ${{ needs.check_timezone.outputs.skip_reason }}"
          {
            echo "### Start workflow skipped"
            echo ""
            echo "- Local time: \`${{ needs.check_timezone.outputs.current_local_time }}\`"
            echo "- Reason: ${{ needs.check_timezone.outputs.skip_reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
  health_check:
    runs-on: ubuntu-latest
    needs: [check_timezone]
    if: ${{ needs.check_timezone.outputs.should_proceed == 'true' }}
    outputs:
      service_healthy: ${{ steps.health_check.outputs.service_healthy }}
    env:
      HOST_NAME: ${{ secrets.HOST_NAME }}
    steps:
      - name: Check if backend is already healthy
        id: health_check
        run: |
          if curl -fsS "$HOST_NAME/healthz" > /dev/null
          then
            echo "service_healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "service_healthy=false" >> "$GITHUB_OUTPUT"
          fi
  skip_already_healthy:
    runs-on: ubuntu-latest
    needs: [check_timezone, health_check]
    if: ${{ needs.check_timezone.outputs.should_proceed == 'true' && needs.health_check.outputs.service_healthy == 'true' }}
    steps:
      - name: Record skipped deploy because service is already healthy
        run: |
          echo "Start workflow skipped deploy because the backend is already healthy."
          {
            echo "### Start deploy skipped"
            echo ""
            echo "- Local time: \`${{ needs.check_timezone.outputs.current_local_time }}\`"
            echo "- Reason: backend already healthy"
          } >> "$GITHUB_STEP_SUMMARY"
  start_ec2_and_deploy:
    runs-on: ubuntu-latest
    needs: [check_timezone, health_check]
    if: ${{ needs.check_timezone.outputs.should_proceed == 'true' && needs.health_check.outputs.service_healthy != 'true' }}
    env:
      DOMAIN: ${{ secrets.DOMAIN }}
      SSH_USER: ${{ secrets.SSH_USER }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      HOST_NAME: ${{ secrets.HOST_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up ansible
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          pwd
          ls -la

          # Install ansible and required dependencie          
          python3 -m pip install ansible boto3
          
          python3 --version
          python3 -m pip -V
          ansible --version

          # Ansible config
          sudo mkdir -p /etc/ansible
          cat << EOF | sudo tee /etc/ansible/ansible.cfg > /dev/null
          # Since Ansible 2.12 (core):
          # To generate an example config file (a "disabled" one with all default settings, commented out):
          #               $ ansible-config init --disabled > ansible.cfg
          #
          # Also you can now have a more complete file by including existing plugins:
          # ansible-config init --disabled -t all > ansible.cfg

          # For previous versions of Ansible you can check for examples in the 'stable' branches of each version
          # Note that this file was always incomplete  and lagging changes to configuration settings

          # for example, for 2.9: https://github.com/ansible/ansible/blob/stable-2.9/examples/ansible.cfg
          [inventory]
          enable_plugins = aws_ec2

          [defaults]
          host_key_checking = False
          EOF

          # create aws-ec2.yml inventory
          cat << EOF > ./instances/ansible/aws_ec2.yml
          plugin: aws_ec2
          regions: us-east-1
          aws_access_key: $AWS_ACCESS_KEY
          aws_secret_key: $AWS_SECRET_KEY
          keyed_groups:
            - key: tags
              prefix: tag
            - key: tags.Name
              separator: ''
          include_filters:
          - tag:Name:
            - 'market_data_notification'
          EOF

          # Create variables
          cat << EOF > ./instances/ansible/vars.yml
          USER: $SSH_USER
          DOMAIN: $DOMAIN
          DOMAINS:
            - $DOMAIN
          ADMIN_EMAIL: $ADMIN_EMAIL
          EOF
      - name: Create AWS config and credentials
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          mkdir ~/.aws/
          cat << EOF > ~/.aws/config
          [default]
          region = $AWS_REGION
          output = json
          EOF
          chmod 600 ~/.aws/config

          cat << EOF > ~/.aws/credentials
          [default]
          aws_access_key_id = $AWS_ACCESS_KEY
          aws_secret_access_key = $AWS_SECRET_KEY
          EOF
          chmod 600 ~/.aws/credentials
      - name: Create SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/market_data_notification_rsa
          chmod 600 ~/.ssh/market_data_notification_rsa
      - name: Run start script
        id: start_script
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          MARKET_DATA_NOTIFICATION_DEPLOY_TOKEN: ${{ secrets.MARKET_DATA_NOTIFICATION_DEPLOY_TOKEN }}
        run: | 
          cd instances
          ./scripts/start.sh $MARKET_DATA_NOTIFICATION_DEPLOY_TOKEN $SSH_USER ~/.ssh/market_data_notification_rsa
      - name: Wait for deployed service health
        run: |
          # start.sh only dispatches backend deploy, so wait here for the service to become healthy.
          for attempt in $(seq 1 30)
          do
            if curl -fsS "$HOST_NAME/healthz" > /dev/null
            then
              echo "market_data_notification is healthy"
              exit 0
            fi
            echo "Waiting for backend deploy health, attempt $attempt"
            sleep 20
          done
          echo "market_data_notification did not become healthy after start"
          exit 1
      - name: Cleanup temporary credentials
        if: ${{ always() }}
        run: sudo rm -rf ./instances/ansible/vars.yml ./instances/ansible/aws_ec2.yml ~/.ssh ~/.aws
  notify_unsuccessful:
    runs-on: ubuntu-latest
    needs: [start_ec2_and_deploy]
    if: ${{ needs.start_ec2_and_deploy.result == 'failure' }}
    steps:
      - name: Send telegram notification unsuccessful run
        env:
          STOCKS_TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.STOCKS_TELEGRAM_DEV_BOT_TOKEN }}
          STOCKS_TELEGRAM_DEV_ID: ${{ secrets.STOCKS_TELEGRAM_DEV_ID }}
        run: |
          now=$(date +%Y-%m-%dT%H:%M:%S)
          text=$(echo "\[Github action\] Market data notification infra: Failed to start EC2 and deploy Market data notification at $now. Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | sed 's~[[:blank:]]~%20~g')
          curl "https://api.telegram.org/bot${STOCKS_TELEGRAM_DEV_BOT_TOKEN}/sendMessage?chat_id=${STOCKS_TELEGRAM_DEV_ID}&text=$text"
  notify_successful:
    runs-on: ubuntu-latest
    needs: [start_ec2_and_deploy]
    if: ${{ always() && needs.start_ec2_and_deploy.result == 'success' }}
    steps:
      - name: Send telegram notification successful run
        env:
          STOCKS_TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.STOCKS_TELEGRAM_DEV_BOT_TOKEN }}
          STOCKS_TELEGRAM_DEV_ID: ${{ secrets.STOCKS_TELEGRAM_DEV_ID }}
        run: |
          now=$(date +%Y-%m-%dT%H:%M:%S)
          text=$(echo "\[Github action\] Market data notification infra: Successfully started EC2 and deployed Market data notification at $now. Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | sed 's~[[:blank:]]~%20~g')
          curl "https://api.telegram.org/bot${STOCKS_TELEGRAM_DEV_BOT_TOKEN}/sendMessage?chat_id=${STOCKS_TELEGRAM_DEV_ID}&text=$text"
