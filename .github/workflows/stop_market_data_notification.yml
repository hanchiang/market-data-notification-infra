name: Stop Market data notification
concurrency:
  group: market-data-notification-instance
  cancel-in-progress: false
permissions:
  contents: read
on:
  schedule:
    # run time can be delayed by up to 30mins
    # 0 = sunday, 6 = saturday
    - cron: '15 13,14 * * 0-6' # every day
    - cron: '35 20,21 * * 0-6' # every day
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: false
        default: 'info'
        type: choice
        options:
        - info
        - warning
        - debug
      ignoreTimezone:
        description: 'Run the workflow, disregarding the scheduled time it is supposed to run'
        type: boolean
        required: false
        default: false
env:
  TZ: America/New_York
  # Market open at 9.30am and close at 4pm local time.
  # Scheduled runs use paired UTC cron entries for DST; gate by local hour
  # so delayed runs still proceed while the DST counterpart hour is skipped.
  AFTER_MARKET_OPEN_STOP_LOCAL_HOUR: 9
  AFTER_MARKET_CLOSE_STOP_LOCAL_HOUR: 16
jobs:
  check_timezone:
    runs-on: ubuntu-latest
    outputs:
      should_proceed: ${{ steps.check_timezone.outputs.should_proceed }}
      current_local_time: ${{ steps.check_timezone.outputs.current_local_time }}
      skip_reason: ${{ steps.check_timezone.outputs.skip_reason }}
    steps:
      - name: Continue running only if current time is inside the local stop window
        id: check_timezone
        env:
          IGNORE_TIMEZONE: ${{ github.event.inputs.ignoreTimezone || 'false' }}
        run: |
          current_local_time=$(TZ=$TZ date +%H%M)
          current_local_time=$((10#$current_local_time))
          current_local_hour=$(TZ=$TZ date +%H)
          current_local_hour=$((10#$current_local_hour))

          if [ "$IGNORE_TIMEZONE" = "true" ]
          then
            echo "should_proceed=true" >> "$GITHUB_OUTPUT"
            echo "current_local_time=$current_local_time" >> "$GITHUB_OUTPUT"
            echo "skip_reason=manual override ignoreTimezone=true" >> "$GITHUB_OUTPUT"
            echo "Ignore timezone"
            exit 0
          fi

          echo "current_local_time: $current_local_time, current_local_hour: $current_local_hour, AFTER_MARKET_OPEN_STOP_LOCAL_HOUR: $AFTER_MARKET_OPEN_STOP_LOCAL_HOUR, AFTER_MARKET_CLOSE_STOP_LOCAL_HOUR: $AFTER_MARKET_CLOSE_STOP_LOCAL_HOUR"

          if [ "$current_local_hour" -eq "$AFTER_MARKET_OPEN_STOP_LOCAL_HOUR" ] || [ "$current_local_hour" -eq "$AFTER_MARKET_CLOSE_STOP_LOCAL_HOUR" ]
          then
            echo "should_proceed=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=inside stop hour" >> "$GITHUB_OUTPUT"
          else
            echo "should_proceed=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=outside local stop hours 09 and 16 America/New_York" >> "$GITHUB_OUTPUT"
          fi

          echo "current_local_time=$current_local_time" >> "$GITHUB_OUTPUT"
  skip_outside_stop_window:
    runs-on: ubuntu-latest
    needs: [check_timezone]
    if: ${{ needs.check_timezone.outputs.should_proceed != 'true' }}
    steps:
      - name: Record skipped stop run
        run: |
          echo "Stop workflow intentionally skipped."
          echo "Local time: ${{ needs.check_timezone.outputs.current_local_time }}"
          echo "Reason: ${{ needs.check_timezone.outputs.skip_reason }}"
          {
            echo "### Stop workflow skipped"
            echo ""
            echo "- Local time: \`${{ needs.check_timezone.outputs.current_local_time }}\`"
            echo "- Reason: ${{ needs.check_timezone.outputs.skip_reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
  health_check:
    runs-on: ubuntu-latest
    needs: [check_timezone]
    if: ${{ needs.check_timezone.outputs.should_proceed == 'true' }}
    outputs:
      health_check_outcome: ${{ steps.health_check.outputs.outcome }}
    env:
      HOST_NAME: ${{ secrets.HOST_NAME }}
    steps:
      - name: Check if EC2 is already stopped
        id: health_check
        run: |
          health_check=$(curl "$HOST_NAME" || true)
          if [ -z "$health_check" ]
          then
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          fi
  notify_ec2_already_stopped:
    runs-on: ubuntu-latest
    needs: [health_check]
    if: ${{ needs.health_check.outputs.health_check_outcome == 'failure' }}
    steps:
      - name: Send telegram notification EC2 is already stopped
        env:
          STOCKS_TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.STOCKS_TELEGRAM_DEV_BOT_TOKEN }}
          STOCKS_TELEGRAM_DEV_ID: ${{ secrets.STOCKS_TELEGRAM_DEV_ID }}
        run: |
          now=$(TZ=$TZ date +%Y-%m-%dT%H:%M:%S%z)
          text=$(echo "\[Github action\] Market data notification infra: EC2 is already stopped at $now. Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | sed 's~[[:blank:]]~%20~g')
          curl "https://api.telegram.org/bot${STOCKS_TELEGRAM_DEV_BOT_TOKEN}/sendMessage?chat_id=${STOCKS_TELEGRAM_DEV_ID}&text=$text"
          exit 0
  stop_ec2:
    runs-on: ubuntu-latest
    needs: [health_check]
    if: ${{ needs.health_check.outputs.health_check_outcome == 'success' }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      DOMAIN: ${{ secrets.DOMAIN }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Create AWS config and credentials
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          pwd
          ls -la

          mkdir ~/.aws/
          cat << EOF > ~/.aws/config
          [default]
          region = $AWS_REGION
          output = json
          EOF
          chmod 600 ~/.aws/config

          cat << EOF > ~/.aws/credentials
          [default]
          aws_access_key_id = $AWS_ACCESS_KEY
          aws_secret_access_key = $AWS_SECRET_KEY
          EOF
          chmod 600 ~/.aws/credentials
      - name: Run stop script
        run: |
          cd instances
          ./scripts/stop.sh
      - name: Cleanup temporary credentials
        if: ${{ always() }}
        run: rm -rf ~/.aws
  notify_unsuccesful_run:
    runs-on: ubuntu-latest
    needs: [stop_ec2]
    if: ${{ needs.stop_ec2.result == 'failure' }}
    steps:
      - name: Send telegram notification unsuccessful run
        env:
          STOCKS_TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.STOCKS_TELEGRAM_DEV_BOT_TOKEN }}
          STOCKS_TELEGRAM_DEV_ID: ${{ secrets.STOCKS_TELEGRAM_DEV_ID }}
        run: |
          now=$(TZ=$TZ date +%Y-%m-%dT%H:%M:%S%z)
          text=$(echo "\[Github action\] Market data notification infra: Failed to stop EC2 at $now. Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | sed 's~[[:blank:]]~%20~g')
          curl "https://api.telegram.org/bot${STOCKS_TELEGRAM_DEV_BOT_TOKEN}/sendMessage?chat_id=${STOCKS_TELEGRAM_DEV_ID}&text=$text"
  notify_successful_run:
    runs-on: ubuntu-latest
    needs: [stop_ec2]
    if: ${{ always() && needs.stop_ec2.result == 'success' }}
    steps:
      - name: Send telegram notification successful run
        env:
          STOCKS_TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.STOCKS_TELEGRAM_DEV_BOT_TOKEN }}
          STOCKS_TELEGRAM_DEV_ID: ${{ secrets.STOCKS_TELEGRAM_DEV_ID }}
        run: |
          now=$(TZ=$TZ date +%Y-%m-%dT%H:%M:%S%z)
          text=$(echo "\[Github action\] Market data notification infra: Successfully stopped EC2 at $now. Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | sed 's~[[:blank:]]~%20~g')
          curl "https://api.telegram.org/bot${STOCKS_TELEGRAM_DEV_BOT_TOKEN}/sendMessage?chat_id=${STOCKS_TELEGRAM_DEV_ID}&text=$text"
