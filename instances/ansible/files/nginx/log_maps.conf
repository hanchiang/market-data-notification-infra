# Variables for json_log.conf. They live here, not in json_log.conf, so the test that bans
# raw fields can read the log_format body alone ($request_uri is raw, and this file has to name it).

# The path exactly as the client sent it, without the query. $uri is decoded and normalised,
# which hides what a scanner actually sent.
map $request_uri $raw_path {
  default "";
  ~^(?<log_raw_path>[^?]*) $log_raw_path;
}

# The referrer without its query. Its values are not filtered, so none is logged.
map $http_referer $referer_without_query {
  default "";
  ~^(?<log_referer_base>[^?]*) $log_referer_base;
}
