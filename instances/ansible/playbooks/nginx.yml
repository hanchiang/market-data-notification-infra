- hosts: all
  name: Configure nginx
  remote_user: "{{ USER }}"
  gather_facts: no
  vars_files:
    - ../vars.yml
  tasks:
    - name: Ensure common nginx config directory exists
      become: yes
      file:
        path: /etc/nginx/common
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install common nginx config fragments
      become: yes
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - src: ../files/nginx/json_log.conf
          dest: /etc/nginx/common/json_log.conf
        - src: ../files/nginx/market_data_notification_upstream.conf
          dest: /etc/nginx/common/market_data_notification_upstream.conf
        - src: ../files/nginx/market_data_notification_proxy.conf
          dest: /etc/nginx/common/market_data_notification_proxy.conf
        - src: ../files/nginx/favicon_location.conf
          dest: /etc/nginx/common/favicon_location.conf
      notify: Validate and reload nginx

    # Removes the largest single source of non-JSON lines: the distro default site
    # is the port-80 default_server and sets no access_log, so every request whose
    # Host matched no server_name — a raw-IP scan — was written in nginx's plain
    # format into the same file the JSON blocks use. Not sufficient on its own;
    # the http-level default in the unmanaged nginx.conf is still non-JSON, so any
    # block arriving without its own access_log reintroduces the defect.
    - name: Disable the distro default nginx site
      become: yes
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Validate and reload nginx

    - name: Install main nginx site config
      become: yes
      template:
        src: ../templates/nginx/market_data_notification_site.conf.j2
        dest: "/etc/nginx/sites-available/{{ DOMAIN }}"
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload nginx

    - name: Ensure nginx site is enabled
      become: yes
      file:
        src: "/etc/nginx/sites-available/{{ DOMAIN }}"
        dest: "/etc/nginx/sites-enabled/{{ DOMAIN }}"
        state: link
        force: true
      notify: Validate and reload nginx

    # The catch-all wins unmatched Hosts only by being the first block to declare
    # 0.0.0.0:80 across the whole sites-enabled glob, which a neighbour site file
    # sorting before ours would take over with `nginx -t` still clean. A comment in
    # the template cannot catch that; this can. Handlers run at end of play, so the
    # flush is what makes these read the config we just reloaded.
    - name: Apply pending nginx changes before asserting
      meta: flush_handlers

    - name: Read the effective nginx config
      become: yes
      command: nginx -T
      register: nginx_effective
      changed_when: false

    - name: List enabled nginx sites
      become: yes
      command: ls /etc/nginx/sites-enabled
      register: nginx_sites_enabled
      changed_when: false

    - name: Assert nothing else claims the port-80 default or the enabled-sites dir
      assert:
        that:
          - "'default_server' not in nginx_effective.stdout"
          - nginx_sites_enabled.stdout_lines | sort == [DOMAIN]
        fail_msg: >-
          Unmatched Hosts may no longer reach the 444 catch-all, and may be logged
          in a non-JSON format. Effective sites-enabled:
          {{ nginx_sites_enabled.stdout_lines }}.

  handlers:
    - name: Validate and reload nginx
      become: yes
      become_method: su
      become_user: root
      become_exe: "sudo su -"
      shell: |
        set -e
        nginx -t
        systemctl reload nginx
