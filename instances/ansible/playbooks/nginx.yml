- hosts: all
  name: Configure nginx
  remote_user: "{{ USER }}"
  gather_facts: no
  vars_files:
    - ../vars.yml
  tasks:
    - name: Ensure common nginx config directory exists
      become: yes
      file:
        path: /etc/nginx/common
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install common nginx config fragments
      become: yes
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - src: ../files/nginx/json_log.conf
          dest: /etc/nginx/common/json_log.conf
        - src: ../files/nginx/market_data_notification_upstream.conf
          dest: /etc/nginx/common/market_data_notification_upstream.conf
        - src: ../files/nginx/market_data_notification_proxy.conf
          dest: /etc/nginx/common/market_data_notification_proxy.conf
        - src: ../files/nginx/favicon_location.conf
          dest: /etc/nginx/common/favicon_location.conf
      notify: Validate and reload nginx

    # Removes the largest single source of non-JSON lines: the distro default site
    # is the port-80 default_server and sets no access_log, so every request whose
    # Host matched no server_name — a raw-IP scan — was written in nginx's plain
    # format into the same file the JSON blocks use. Not sufficient on its own;
    # the http-level default in the unmanaged nginx.conf is still non-JSON, so any
    # block arriving without its own access_log reintroduces the defect.
    - name: Disable the distro default nginx site
      become: yes
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Validate and reload nginx

    - name: Install main nginx site config
      become: yes
      template:
        src: ../templates/nginx/market_data_notification_site.conf.j2
        dest: "/etc/nginx/sites-available/{{ DOMAIN }}"
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload nginx

    - name: Ensure nginx site is enabled
      become: yes
      file:
        src: "/etc/nginx/sites-available/{{ DOMAIN }}"
        dest: "/etc/nginx/sites-enabled/{{ DOMAIN }}"
        state: link
        force: true
      notify: Validate and reload nginx

    # The catch-all declares no default_server, so it wins unmatched Hosts only by
    # being the first block to declare 0.0.0.0:80 anywhere in the http context —
    # conf.d and the unmanaged nginx.conf included, and conf.d is included first.
    # No file listing can prove that, so probe the property instead: an unmatched
    # Host must reach the catch-all's `return 444`, which closes the connection
    # with no response and makes curl exit 52. Any other exit means some other
    # block took the default, costing both the 444 policy and the JSON log format
    # while `nginx -t` stays clean.
    # The flush is for ordering, not visibility: it fails the play on a bad config
    # or a failed reload before this probe reports something confusing.
    - name: Apply pending nginx changes before probing
      meta: flush_handlers

    - name: Probe that an unmatched Host still reaches the 444 catch-all
      # Connects locally but claims a Host that can never match a server_name, so
      # nginx routes it the way it routes a raw-IP scan. .invalid is reserved for
      # exactly this (RFC 2606). No traffic leaves the box.
      command: "curl -s -o /dev/null -m 5 -H 'Host: no-such-host.invalid' http://127.0.0.1/"
      register: catch_all_probe
      changed_when: false
      check_mode: false
      failed_when: catch_all_probe.rc != 52

  handlers:
    - name: Validate and reload nginx
      become: yes
      become_method: su
      become_user: root
      become_exe: "sudo su -"
      shell: |
        set -e
        nginx -t
        systemctl reload nginx
